name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3

      - name: Restore live data files from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          # Fetch the LIVE posts.json from GitHub API (what portal saved)
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/Buddika-A-Silva/Arctic-Tech-Guide/contents/posts.json?ref=main" \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); open('posts.json','w').write(base64.b64decode(d['content']).decode())" \
            || echo "[]" > posts.json

          # Fetch the LIVE users.json from GitHub API (what portal saved)
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/Buddika-A-Silva/Arctic-Tech-Guide/contents/users.json?ref=main" \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); open('users.json','w').write(base64.b64decode(d['content']).decode())" \
            || echo "[]" > users.json

          echo "Live data restored:"
          echo "posts.json: $(cat posts.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d), "posts")')"
          echo "users.json: $(cat users.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d), "users")')"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "/"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close