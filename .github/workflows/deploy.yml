name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3

      - name: Fetch live data from GitHub API
        run: |
          python3 - << 'EOF'
          import urllib.request, json, base64

          BASE  = "https://api.github.com/repos/Buddika-A-Silva/Arctic-Tech-Guide/contents"

          for f in ["posts.json", "users.json"]:
              try:
                  req = urllib.request.Request(f"{BASE}/{f}?ref=main")
                  res = json.loads(urllib.request.urlopen(req).read())
                  content = base64.b64decode(res["content"]).decode()
                  open(f, "w").write(content)
                  print(f"{f}: {len(json.loads(content))} records")
              except Exception as e:
                  open(f, "w").write("[]")
                  print(f"{f}: fallback to [] ({e})")
          EOF

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "/"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close